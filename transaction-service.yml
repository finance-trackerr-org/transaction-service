apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: 225828830130.dkr.ecr.ap-south-1.amazonaws.com/finance-tracker:transaction-service
          resources:
            limits:
              memory: "400Mi"
              cpu: "200m"
            requests:
              memory: "200Mi"
              cpu: "100m"
          ports:
            - containerPort: 8081

---

apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  selector:
    app: transaction-service
  ports:
    - port: 8081
      targetPort: 8081
